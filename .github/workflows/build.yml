name: build-sdl2-libs
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: sed 's/\r$//' build-sdl2-libs.sh > /tmp/b.sh && bash /tmp/b.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libs_sdl2
          path: /out/*
